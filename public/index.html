<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List — Dashboard</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#465FFF',
              'primary-dark': '#3a50e0',
            },
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui'],
            },
          },
        },
      };
    </script>

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body { font-family: 'Inter', sans-serif; }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

      /* Sidebar active link */
      .nav-link.active { background: #eff2ff; color: #465FFF; }
      .nav-link.active svg { stroke: #465FFF; }

      /* Todo item animation */
      #todo-list li { animation: slideIn 0.15s ease; }
      @keyframes slideIn {
        from { opacity: 0; transform: translateX(-8px); }
        to   { opacity: 1; transform: translateX(0); }
      }

      /* Checkbox custom */
      input[type="checkbox"] { accent-color: #465FFF; }
    </style>
  </head>

  <body class="bg-[#F1F5F9] min-h-screen flex">

    <!-- ══════════════ SIDEBAR ══════════════ -->
    <aside class="hidden lg:flex flex-col w-64 min-h-screen bg-white border-r border-gray-200 fixed top-0 left-0">

      <!-- Logo -->
      <div class="flex items-center gap-3 px-6 h-16 border-b border-gray-200">
        <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
          </svg>
        </div>
        <span class="text-base font-semibold text-gray-900">TodoApp</span>
      </div>

      <!-- Nav Menu -->
      <nav class="flex-1 px-4 py-5 space-y-1">
        <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-widest px-2 mb-2">Menu</p>

        <a href="#" class="nav-link active flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors">
          <svg class="w-4.5 h-4.5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:18px;height:18px">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
          My Tasks
        </a>

        <a href="#" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-100 transition-colors">
          <svg class="flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:18px;height:18px">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          Dashboard
        </a>

        <a href="#" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-100 transition-colors">
          <svg class="flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:18px;height:18px">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          Calendar
        </a>

        <a href="#" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-100 transition-colors">
          <svg class="flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:18px;height:18px">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
          </svg>
          Analytics
        </a>

        <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-widest px-2 mt-5 mb-2">Settings</p>

        <a href="#" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-gray-500 hover:bg-gray-100 transition-colors">
          <svg class="flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="width:18px;height:18px">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          Settings
        </a>
      </nav>

      <!-- User profile -->
      <div class="px-4 py-4 border-t border-gray-200">
        <div class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-gray-100 transition-colors cursor-pointer">
          <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white text-xs font-semibold flex-shrink-0">TT</div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-gray-900 truncate">TanTany</p>
            <p class="text-xs text-gray-400 truncate">tantany@example.com</p>
          </div>
        </div>
      </div>
    </aside>

    <!-- ══════════════ MAIN ══════════════ -->
    <div class="flex-1 flex flex-col lg:ml-64 min-h-screen">

      <!-- TOPBAR -->
      <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 sticky top-0 z-10">
        <div class="flex items-center gap-3">
          <!-- Mobile menu icon -->
          <button class="lg:hidden text-gray-500 hover:text-gray-700">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
          <div>
            <h2 class="text-sm font-semibold text-gray-900">My Tasks</h2>
            <p class="text-xs text-gray-400 hidden sm:block">Manage and track your daily tasks</p>
          </div>
        </div>

        <div class="flex items-center gap-3">
          <!-- Notification bell -->
          <button class="relative w-9 h-9 flex items-center justify-center rounded-xl hover:bg-gray-100 text-gray-500 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
            <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
          </button>

          <!-- Avatar -->
          <div class="w-9 h-9 rounded-xl bg-primary flex items-center justify-center text-white text-xs font-semibold cursor-pointer">TT</div>
        </div>
      </header>

      <!-- PAGE CONTENT -->
      <main class="flex-1 p-6">

        <!-- Stat Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">

          <div class="bg-white rounded-2xl border border-gray-200 p-5">
            <div class="flex items-center justify-between mb-3">
              <span class="text-xs font-medium text-gray-400 uppercase tracking-wide">Total</span>
              <div class="w-8 h-8 rounded-xl bg-blue-50 flex items-center justify-center">
                <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2"/>
                </svg>
              </div>
            </div>
            <p id="stat-total" class="text-2xl font-bold text-gray-900">0</p>
            <p class="text-xs text-gray-400 mt-1">tasks</p>
          </div>

          <div class="bg-white rounded-2xl border border-gray-200 p-5">
            <div class="flex items-center justify-between mb-3">
              <span class="text-xs font-medium text-gray-400 uppercase tracking-wide">Active</span>
              <div class="w-8 h-8 rounded-xl bg-orange-50 flex items-center justify-center">
                <svg class="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
              </div>
            </div>
            <p id="stat-active" class="text-2xl font-bold text-gray-900">0</p>
            <p class="text-xs text-gray-400 mt-1">remaining</p>
          </div>

          <div class="bg-white rounded-2xl border border-gray-200 p-5">
            <div class="flex items-center justify-between mb-3">
              <span class="text-xs font-medium text-gray-400 uppercase tracking-wide">Done</span>
              <div class="w-8 h-8 rounded-xl bg-green-50 flex items-center justify-center">
                <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
              </div>
            </div>
            <p id="stat-done" class="text-2xl font-bold text-gray-900">0</p>
            <p class="text-xs text-gray-400 mt-1">completed</p>
          </div>

          <div class="bg-white rounded-2xl border border-gray-200 p-5">
            <div class="flex items-center justify-between mb-3">
              <span class="text-xs font-medium text-gray-400 uppercase tracking-wide">Progress</span>
              <div class="w-8 h-8 rounded-xl bg-purple-50 flex items-center justify-center">
                <svg class="w-4 h-4 text-purple-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                </svg>
              </div>
            </div>
            <p id="stat-progress" class="text-2xl font-bold text-gray-900">0%</p>
            <p class="text-xs text-gray-400 mt-1">completion</p>
          </div>

        </div>

        <!-- Main Card -->
        <div class="bg-white rounded-2xl border border-gray-200 overflow-hidden">

          <!-- Card Header -->
          <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
            <h3 class="text-sm font-semibold text-gray-900">Task List</h3>

            <!-- Filter tabs -->
            <div class="flex items-center gap-1 bg-gray-100 p-1 rounded-xl">
              <button class="filter-btn text-xs font-medium px-3 py-1.5 rounded-lg bg-white text-primary shadow-sm transition" data-filter="all">All</button>
              <button class="filter-btn text-xs font-medium px-3 py-1.5 rounded-lg text-gray-500 hover:text-gray-700 transition" data-filter="active">Active</button>
              <button class="filter-btn text-xs font-medium px-3 py-1.5 rounded-lg text-gray-500 hover:text-gray-700 transition" data-filter="completed">Done</button>
            </div>
          </div>

          <!-- Add Task Input -->
          <div class="px-6 py-4 border-b border-gray-100 bg-gray-50">
            <div class="flex gap-3">
              <input
                type="text"
                id="todo-input"
                placeholder="Add a new task and press Enter or click Add..."
                maxlength="200"
                autocomplete="off"
                class="flex-1 bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-900
                       placeholder-gray-400 outline-none focus:border-primary focus:ring-2 focus:ring-primary/20
                       transition"
              />
              <button
                id="add-btn"
                class="bg-primary hover:bg-primary-dark text-white text-sm font-semibold
                       px-5 py-2.5 rounded-xl transition cursor-pointer whitespace-nowrap flex items-center gap-2"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                </svg>
                Add Task
              </button>
            </div>
            <p id="error-msg" class="text-red-500 text-xs mt-2 min-h-[16px]"></p>
          </div>

          <!-- Progress Bar -->
          <div class="px-6 py-3 border-b border-gray-100">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs text-gray-400">Overall Progress</span>
              <span id="progress-label" class="text-xs font-semibold text-primary">0%</span>
            </div>
            <div class="w-full bg-gray-100 rounded-full h-1.5">
              <div id="progress-bar" class="bg-primary h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
          </div>

          <!-- Todo List -->
          <ul id="todo-list" class="divide-y divide-gray-50"></ul>

          <!-- Footer -->
          <div class="px-6 py-3 bg-gray-50 border-t border-gray-100 flex items-center justify-between">
            <p id="footer-count" class="text-xs text-gray-400"></p>
            <span class="text-xs text-gray-300">Saved to server</span>
          </div>

        </div>
      </main>
    </div>

    <script src="app.js"></script>

    <script>
      // ── Filter tab active state ──────────────────────────────
      function setActiveFilter(selectedBtn) {
        document.querySelectorAll('.filter-btn').forEach((btn) => {
          const isActive = btn === selectedBtn;
          btn.classList.toggle('bg-white',    isActive);
          btn.classList.toggle('text-primary', isActive);
          btn.classList.toggle('shadow-sm',    isActive);
          btn.classList.toggle('text-gray-500', !isActive);
        });
      }

      document.querySelectorAll('.filter-btn').forEach((btn) => {
        btn.addEventListener('click', () => setActiveFilter(btn));
      });
    </script>
  </body>
</html>
